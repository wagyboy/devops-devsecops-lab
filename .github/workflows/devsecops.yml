# DevSecOps pipeline: every push and pull request runs four security gates.
# Any gate that finds a problem fails the run, so the change cannot be merged unnoticed.
name: devsecops

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Flake8 + bandit + bugbear)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8==7.4.1 flake8-bandit==4.1.1 flake8-bugbear==26.10.27
      - run: flake8 app scripts

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload findings to the Security > Code scanning tab
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: semgrep scan --config p/python --config p/flask --config p/secrets --sarif --output semgrep.sarif --error --metrics off
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dockerfile:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning - < app/Dockerfile

  image-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t a9-shop:${{ github.sha }} app
      # Pinned to a commit SHA, not a tag: in March 2026 an attacker force-pushed 76 of the
      # 77 trivy-action tags (CVE-2026-33634). v0.35.0 = 57a97c7 was not affected.
      - name: Trivy (report to Code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: a9-shop:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          version: v0.69.3
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Trivy gate (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: a9-shop:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.69.3
          skip-setup-trivy: true

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: [image-scan]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Start the shop
        run: |
          docker build -t a9-shop:ci app
          docker network create zapnet
          docker run -d --name shop --network zapnet a9-shop:ci
          sleep 5
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network zapnet -v "$PWD/zap:/zap/wrk" zaproxy/zap-stable:2.17.0 \
            zap-baseline.py -t http://shop:8000 -r zap-baseline.html -J zap-baseline.json -I
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: zap/
